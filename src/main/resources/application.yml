spring:
  application:
    name: shop-basic
  # 애플리케이션 DB: H2 메모리 DB, MSSQL 호환 모드. 실행(테스트 컨텍스트)마다 따로 만든다.
  # 사람·AI가 SQL을 실행해 보는 개발 DB는 별도 파일 DB다 (./gradlew dbReset, node scripts/db.mjs).
  datasource:
    url: jdbc:h2:mem:shop-${random.uuid};MODE=MSSQLServer;DB_CLOSE_DELAY=-1
    username: sa
    password:
  sql:
    init:
      # 개발 DB는 시작할 때마다 schema.sql -> data.sql 순서로 새로 만든다.
      # 운영 DB에는 자동 반영되지 않는다.
      mode: always
      encoding: UTF-8

mybatis:
  # 매퍼 XML 위치 (src/main/resources/mapper/<기능>/XxxMapper.xml)
  mapper-locations: classpath:mapper/**/*.xml

logging:
  level:
    com.example.shop: INFO
